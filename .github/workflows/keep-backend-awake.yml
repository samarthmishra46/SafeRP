# Backup keep-alive for the free Render backend (primary: cron-job.org, see DEPLOY.md).
# Render sleeps a free service after 15 minutes without traffic; this pings it every 10.
# Enable by adding the repository variable BACKEND_URL (Settings > Secrets and variables >
# Actions > Variables), e.g. https://saferp-api.onrender.com
name: Keep backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Ping /api/health
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "BACKEND_URL is not set; nothing to ping."
            exit 0
          fi
          # A sleeping service can take up to a minute to wake, hence the generous timeout.
          curl --fail --silent --show-error --retry 3 --retry-delay 15 --max-time 90 \
            "${BACKEND_URL%/}/api/health"
